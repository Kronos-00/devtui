[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.bash-language-server]
command = "bash-language-server"
args = ["start"]

[language-server.bash-language-server.config.bashIde]
shellcheckPath = "shellcheck"

[language-server.cmake-language-server]
command = "cmake-language-server"

[[language]]
name = "c"
language-servers = ["clangd"]
formatter = { command = "clang-format" }
auto-format = true

[[language]]
name = "cpp"
language-servers = ["clangd"]
formatter = { command = "clang-format" }
auto-format = true
[[language]]
name = "cmake"
language-servers = ["cmake-language-server"]
formatter = { command = "cmake-format", args = ["-"] }
auto-format = true

[[language]]
name = "bash"
language-servers = ["bash-language-server"]
formatter = { command = "shfmt" }
auto-format = true

[[language]]
name = "python"
language-servers = ["pyright", "ruff"]
formatter = { command = "ruff", args = ["format", "-"] }
auto-format = true

[language.debugger]
name = "debugpy"
transport = "stdio"
command = "debugpy-adapter"

[[language.debugger.templates]]
name = "launch file"
request = "launch"
completion = [{ name = "program", completion = "filename" }]
args = { program = "{0}", python = ["__DEVTUI_PYTHON__"], console = "internalConsole" }
