gui:
  showFileTree: true
  showCommandLog: false
  showBottomLine: true
  showPanelJumps: true
  mouseEvents: true
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
os:
  edit: '__HOME__/.local/bin/devtui-helix-open "{{filename}}"'
  editAtLine: '__HOME__/.local/bin/devtui-helix-open "{{filename}}" "{{line}}"'
  editInTerminal: false
promptToReturnFromSubprocess: false
