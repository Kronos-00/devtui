theme = "onedark"

[editor]
mouse = true
middle-click-paste = false
bufferline = "always"
clipboard-provider = "termcode"
line-number = "absolute"
true-color = true
popup-border = "all"
color-modes = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-explorer]
hidden = false
ignore = false
git-ignore = false
git-global = false
git-exclude = false
parents = false
flatten-dirs = false

[editor.file-picker]
hidden = false
ignore = false
git-ignore = false
git-global = false
git-exclude = false
parents = false

[keys.normal]
esc = "devtui_clear_selections"
C-s = ":write"
C-S-s = "devtui_save_as"
C-z = "undo"
C-y = "redo"
C-S-z = "redo"
C-c = "devtui_copy_to_clipboard"
C-x = "devtui_cut_to_clipboard"
C-a = "select_all"
C-l = "extend_line"
C-f = "devtui_find"
C-h = "devtui_current_replace"
C-p = "file_picker"
C-S-f = "global_search"
C-S-h = "devtui_project_replace"
C-S-p = "command_palette"
C-S-e = "file_explorer"
C-S-d = "devtui_debug_menu"
C-S-o = "lsp_or_syntax_symbol_picker"
C-d = "devtui_add_next_occurrence"
C-S-l = "devtui_add_all_occurrences"
C-F2 = "devtui_add_all_occurrences"
"C-up" = "copy_selection_on_prev_line"
"C-down" = "copy_selection_on_next_line"
"C-ret" = "open_below"
"C-S-ret" = "open_above"
C-S-k = ["extend_line", "delete_selection"]
"A-g" = "devtui_goto_line_prompt"
"C-/" = "toggle_comments"
"C-_" = "toggle_comments"
"C-." = "code_action"
F1 = "command_palette"
F2 = "rename_symbol"
F12 = "goto_definition"
S-F12 = "goto_reference"
F8 = "goto_next_diag"
S-F8 = "goto_prev_diag"
F24 = "redo"
F5 = "devtui_debug_start_or_continue"
F6 = "dap_pause"
F9 = "dap_toggle_breakpoint"
F10 = "dap_next"
F11 = "dap_step_in"
S-F11 = "dap_step_out"
S-F5 = "dap_terminate"
C-S-F5 = "dap_restart"

[keys.normal.space.c]
h = "switch_source_header"
i = "devtui_lsp_info"
v = "devtui_python_venv"
x = "devtui_symbol_context_menu"

[keys.normal.space.d]
b = "dap_toggle_breakpoint"
c = "dap_continue"
i = "dap_step_in"
O = "dap_next"
o = "dap_step_out"
u = "devtui_debug_menu"
v = "dap_variables"
s = "dap_switch_stack_frame"
t = "dap_terminate"

