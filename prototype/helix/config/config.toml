theme = "onedark"

[editor]
mouse = true
middle-click-paste = false
bufferline = "always"
clipboard-provider = "termcode"
line-number = "absolute"
true-color = true
popup-border = "all"
color-modes = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-explorer]
hidden = false
ignore = false
git-ignore = false
git-global = false
git-exclude = false
parents = false
flatten-dirs = false

[keys.normal]
C-s = ":write"
C-S-s = "devtui_save_as"
C-z = "undo"
C-y = "redo"
C-S-z = "redo"
C-c = "devtui_copy_to_clipboard"
C-x = "devtui_cut_to_clipboard"
C-a = "select_all"
C-l = "extend_line"
C-f = "search"
C-h = "devtui_current_replace"
C-p = "file_picker"
C-S-f = "global_search"
C-S-h = "devtui_project_replace"
C-S-p = "command_palette"
C-S-e = "file_explorer"
C-S-o = "lsp_or_syntax_symbol_picker"
C-d = "devtui_add_next_occurrence"
C-S-l = "devtui_add_all_occurrences"
C-F2 = "devtui_add_all_occurrences"
"C-up" = "copy_selection_on_prev_line"
"C-down" = "copy_selection_on_next_line"
"C-ret" = "open_below"
"C-S-ret" = "open_above"
C-S-k = ["extend_line", "delete_selection"]
"A-g" = "devtui_goto_line_prompt"
"C-/" = "toggle_comments"
"C-_" = "toggle_comments"
"C-." = "code_action"
F1 = "command_palette"
F2 = "rename_symbol"
F12 = "goto_definition"
S-F12 = "goto_reference"
F8 = "goto_next_diag"
S-F8 = "goto_prev_diag"
F24 = "redo"

[keys.normal.space.c]
h = "switch_source_header"
x = "devtui_symbol_context_menu"

[keys.normal.space.d]
b = "dap_toggle_breakpoint"
c = "dap_continue"
i = "dap_step_in"
O = "dap_next"
o = "dap_step_out"
u = "dap_variables"
t = "dap_terminate"

[keys.insert]
C-s = ":write"
C-S-s = "devtui_save_as"
C-z = "undo"
C-y = "redo"
C-S-z = "redo"
C-c = "devtui_copy_to_clipboard"
C-x = "devtui_cut_to_clipboard"
C-h = "devtui_current_replace"
"C-ret" = ["normal_mode", "open_below"]
"C-S-ret" = ["normal_mode", "open_above"]
C-S-k = ["normal_mode", "extend_line", "delete_selection", "insert_mode"]
"A-g" = "devtui_goto_line_prompt"
"C-." = "code_action"
F1 = "command_palette"
F2 = "rename_symbol"
F24 = "redo"

[keys.select]
C-c = "devtui_copy_to_clipboard"
C-x = "devtui_cut_to_clipboard"
C-l = "extend_line"
C-h = "devtui_current_replace"
C-d = "devtui_add_next_occurrence"
C-S-l = "devtui_add_all_occurrences"
C-F2 = "devtui_add_all_occurrences"
"C-up" = "copy_selection_on_prev_line"
"C-down" = "copy_selection_on_next_line"
"C-ret" = ["normal_mode", "open_below"]
"C-S-ret" = ["normal_mode", "open_above"]
C-S-k = ["normal_mode", "extend_line", "delete_selection"]
"C-/" = "toggle_comments"
"C-_" = "toggle_comments"
"C-." = "code_action"
F1 = "command_palette"
F2 = "rename_symbol"
F24 = "redo"
